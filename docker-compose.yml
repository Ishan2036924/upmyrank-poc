services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: upmyrank-postgres
    environment:
      POSTGRES_USER: upmyrank
      POSTGRES_PASSWORD: upmyrank
      POSTGRES_DB: upmyrank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upmyrank -d upmyrank"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: upmyrank-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: upmyrank-pgdata
