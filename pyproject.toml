[project]
name = "upmyrank-poc"
version = "0.1.0"
description = "AI-powered JEE/NEET tutoring platform POC"
authors = [
    {name = "upmyrank"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "sentence-transformers (>=5.2.3,<6.0.0)",
    "openai (>=1.82.0,<2.0.0)",
    "pymupdf (>=1.27.2,<2.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "streamlit (>=1.55.0,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "httpx (>=0.28.1,<0.29.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "datasets (>=4.7.0,<5.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "supabase (>=2.3.0,<3.0.0)",
    "pdfplumber (>=0.11.9,<0.12.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
